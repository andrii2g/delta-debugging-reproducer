name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test --configuration Release
      - run: dotnet run --project src/DeltaDebugging.Cli --configuration Release -- generate resource-lifecycle --count 1000 --seed 42 --output artifacts/input.json
      - run: dotnet run --project src/DeltaDebugging.Cli --configuration Release -- minimize artifacts/input.json --output artifacts/result
